version: '3.8'

services:
  vector-app:
    container_name: vector-service
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8002:8000"
    environment:
      - MILVUS_HOST=milvus-standalone
      - MILVUS_PORT=19530
      - POSTGRES_HOST=vector-postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=vectoruser
      - POSTGRES_PASSWORD=vectorpass
      - POSTGRES_DB=vector_metadata
      - EMBEDDING_MODEL=all-MiniLM-L6-v2
      - CHUNK_SIZE=512
      - CHUNK_OVERLAP=50
      # Connect to doc_upload API gateway on the shared network
      - DOC_UPLOAD_SERVICE_URL=http://doc_upload_api:8080
    depends_on:
      milvus-standalone:
        condition: service_healthy
      vector-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - vector_network
      - rag_shared_network
    restart: unless-stopped

  # Milvus dependencies
  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - vector_network

  minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - vector_network

  # Milvus vector database (vertically scalable)
  milvus-standalone:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.3.3
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      # Milvus tuning - adjust based on allocated memory
      QUERY_NODE_MEMORY_HIGH_WATER_LEVEL: "0.85"
      QUERY_NODE_MEMORY_LOW_WATER_LEVEL: "0.70"
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio
    networks:
      - vector_network
    # Resource limits - adjust these to scale vertically
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 1G

  # PostgreSQL for metadata (vertically scalable)
  vector-postgres:
    container_name: vector-postgres
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: vectoruser
      POSTGRES_PASSWORD: vectorpass
      POSTGRES_DB: vector_metadata
      # PostgreSQL tuning (adjust based on allocated memory)
      POSTGRES_SHARED_BUFFERS: 256MB
      POSTGRES_WORK_MEM: 64MB
      POSTGRES_MAINTENANCE_WORK_MEM: 128MB
      POSTGRES_EFFECTIVE_CACHE_SIZE: 512MB
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vectoruser -d vector_metadata"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vector_network
    # Resource limits - adjust these to scale vertically
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

volumes:
  etcd_data:
  minio_data:
  milvus_data:
  postgres_data:

networks:
  vector_network:
    driver: bridge
  # Connect to the shared network created by doc_upload
  rag_shared_network:
    external: true
    name: rag_shared_network
