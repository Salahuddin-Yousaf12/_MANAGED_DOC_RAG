version: "3.8"

services:
  redis:
    container_name: rag-redis
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rag_shared_network

volumes:
  redis_data:

networks:
  rag_shared_network:
    external: true
